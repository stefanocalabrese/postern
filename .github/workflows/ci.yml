name: ci

# workflow_dispatch ONLY. Do not add `push` or `pull_request` triggers:
# Actions minutes are billed on this private repository and the owner has
# none to spend. `make ci` runs the same six gates below locally for free and
# is the actual gate that must pass before any commit (see CLAUDE.md). Since
# Task 3, `test` starts its own disposable `testcontainers` Postgres for the
# consent-repository tests (measured ~2s added, session-scoped so paid once),
# so `make ci` is no longer fully offline; it degrades to an explicit skip,
# not a crash, when a local machine has no Docker running (see `pg_url` in
# tests/conftest.py). `alembic check` is NO LONGER a gate `make ci` misses:
# `tests/test_schema_drift.py` runs the same drift check inside `make test`,
# against that disposable container, and blocks on it. What this workflow's
# final step adds is the same check against a Postgres whose URL is fixed in
# advance, which is a different thing to have exercised and costs nothing on a
# manually dispatched run.
on:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    # `alembic check` runs in two places now. `make test` runs it locally via
    # `tests/test_schema_drift.py`, against the disposable `testcontainers`
    # Postgres that fixture owns, so schema drift already blocks `make ci`
    # (commit 1808c24). The `migrations` target below is the same check
    # against a database URL fixed in advance -- what an operator points at a
    # staging replica by hand, and what this workflow gets for free from the
    # service container. `make test` still starts its own second, independent
    # container, which this service container does not replace.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postern
          POSTGRES_PASSWORD: postern
          POSTGRES_DB: postern
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postern"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      POSTERN_DATABASE_URL: postgresql+asyncpg://postern:postern@localhost:5432/postern
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: make fmt-check
      - run: make type
      - run: make imports
      - run: make lock
      - run: make test
      - run: uv run alembic upgrade head
      - run: make migrations
