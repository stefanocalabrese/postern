name: deploy

# workflow_dispatch ONLY — same model as ci.yml to avoid billed minutes.
# Two stages: build (always runs on dispatch) and deploy (requires manual
# environment approval). Each stage is idempotent.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

# Workflow-level floor. A job-level `permissions` block REPLACES this one
# rather than merging with it, so each job below restates everything it needs;
# the value of the floor is that a job added later with no block of its own
# gets read-only and not `id-token: write`, which is the grant worth keeping
# scarce here.
permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}

jobs:
  # ── Build stage ────────────────────────────────────────────────

  build:
    name: build
    runs-on: ubuntu-latest
    # `id-token: write` is not a hardening extra here, it is the difference
    # between this job running and failing at its fourth step. It is never
    # granted by a repository default -- GitHub issues no OIDC token unless a
    # workflow asks for one -- so before this block existed the first real
    # dispatch would have died at "Configure AWS credentials", before ECR
    # login and before the build. Two steps need it:
    #   - `aws-actions/configure-aws-credentials` assumes `AWS_ROLE_ARN` by
    #     OIDC federation with no static keys; its README states the
    #     requirement as "Need ID token write permission to use OIDC".
    #   - cosign signs keylessly, which means exchanging a GitHub OIDC token
    #     for a Fulcio certificate. `sigstore/cosign-installer`'s README
    #     carries the same line: "id-token: write # needed for signing the
    #     images with GitHub OIDC Token".
    #
    # `contents: read` covers `actions/checkout`, and covers the public-repo
    # reads that `astral-sh/setup-uv` and `aquasecurity/trivy-action`
    # (`token-setup-trivy`, defaulted to `github.token`) make to fetch their
    # own binaries.
    #
    # Deliberately NOT granted, each checked rather than assumed:
    #   - `packages: write`. Images go to ECR via `secrets.AWS_ECR_REGISTRY`,
    #     authenticated by `aws-actions/amazon-ecr-login`. That scope governs
    #     GHCR, which this workflow never touches.
    #   - `security-events: write`. Both Trivy steps use `format: table` and
    #     there is no SARIF upload step; trivy-action's README asks for that
    #     scope only in its SARIF examples and declares plain `contents: read`
    #     for a table scan.
    #   - `contents: write` / `actions: read`, which `anchore/sbom-action`'s
    #     README lists. Read against its source rather than its README: those
    #     are for the release-asset path. `attachReleaseAssets` reaches a
    #     GitHub API call only when `eventName === "release"`, or on a push to
    #     `refs/tags/*`; on `workflow_dispatch` `release` stays undefined and
    #     every API call in that function sits inside `if (release)`. The
    #     workflow-artifact upload it does perform goes through
    #     `@actions/artifact`, on `ACTIONS_RUNTIME_TOKEN`.
    #   - any scope for `actions/upload-artifact`, whose `action.yml` declares
    #     no `github-token` input at all.
    permissions:
      contents: read
      id-token: write
    outputs:
      api_digest: ${{ steps.push-api.outputs.digest }}
      confirm_digest: ${{ steps.push-confirm.outputs.digest }}
    steps:
      # Every action below is pinned to a full commit SHA, not a major tag.
      # This job assumes an IAM role and holds ECR push credentials, so a
      # repointed `aws-actions/configure-aws-credentials@v4` would run
      # attacker-chosen code with live AWS credentials in scope. The trailing
      # comment names the release tag each SHA was resolved from on
      # 25 September 2026, and is what dependabot matches on to bump it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # ── CI gates (must pass before build) ───────────────────────
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - run: make fmt-check
      - run: make type
      - run: make imports
      - run: make lock
      - run: make test

      # ── Docker buildx (multi-platform, cache to ECR) ────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7

      - name: Build and push api image
        id: push-api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          push: true
          target: api
          tags: |
            ${{ env.REGISTRY }}/postern-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/postern-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/postern-api:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push confirm image
        id: push-confirm
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          push: true
          target: confirm
          tags: |
            ${{ env.REGISTRY }}/postern-confirm:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/postern-confirm:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/postern-confirm:buildcache,mode=max
          platforms: linux/amd64,linux/arm64

      # ── SBOM generation (syft → SPDX) ───────────────────────────
      - name: Generate SBOM — api
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/postern-api:${{ github.sha }}
          output-file: sbom-api.spdx.json
          format: spdx-json

      - name: Generate SBOM — confirm
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/postern-confirm:${{ github.sha }}
          output-file: sbom-confirm.spdx.json
          format: spdx-json

      # ── Vulnerability scanning (Trivy) ──────────────────────────
      # These two steps carried `aquasecurity/trivy-action@v0` until now, and
      # that ref resolves to nothing. Re-checked 25 September 2026 against the
      # GitHub API: the repository publishes full patch tags only (`v0.36.0`,
      # `v0.35.0`, ... down to `v0.23.0`) and has neither a `v0` tag nor a `v0`
      # branch, so `git/ref/tags/v0` answers 404 and `commits/v0` answers 422.
      # Every dispatch that reached here failed to resolve the action, which
      # means the vulnerability-scanning half of gate 7b has never once run,
      # while `tests/test_zt3_deploy_pipeline.py` and CLAUDE.md both recorded
      # it as built and blocking.
      #
      # Pinned to v0.36.0, the current stable release (published 2026-04-22,
      # not a prerelease, and the highest tag the repository carries). Its
      # annotated tag object `a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8`
      # dereferences to the commit below; that release ships Trivy v0.70.0.
      #
      # Every input these steps pass was checked against v0.36.0's
      # `action.yaml` rather than assumed, because a step written against a
      # version that never ran can be wrong in silence. All four survive and
      # all four are still consumed: `image-ref` (documented there as "for
      # backward compatibility", and still the value `entrypoint.sh` assigns
      # to `scanRef`), plus `format`, `severity` and `exit-code`, which the
      # composite action exports as `TRIVY_FORMAT`, `TRIVY_SEVERITY` and
      # `TRIVY_EXIT_CODE`. `scan-type` is left at its `image` default. No
      # rename, no removal, so neither step changes shape.
      - name: Run Trivy scan — api
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/postern-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Run Trivy scan — confirm
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/postern-confirm:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

      # ── Cosign signing (keyless, OIDC from GitHub) ──────────────
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3.9.1

      - name: Sign api image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/postern-api@${{ steps.push-api.outputs.digest }}"

      - name: Sign confirm image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/postern-confirm@${{ steps.push-confirm.outputs.digest }}"

      # ── Upload SBOMs as artifacts (audit retention) ─────────────
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sboms-${{ github.sha }}
          path: |
            sbom-api.spdx.json
            sbom-confirm.spdx.json
          retention-days: 2555  # ~7 years for regulated compliance

  # ── Deploy stage ───────────────────────────────────────────────

  deploy:
    name: deploy (${{ github.event.inputs.environment }})
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}  # branch policy only -- not a human gate, see below
    # Same two scopes, for one fewer reason. `id-token: write` is here for
    # `aws-actions/configure-aws-credentials` only: `cosign verify` checks a
    # Fulcio certificate against the Rekor log and mints no OIDC token, so
    # signature verification would pass without it while the AWS role
    # assumption above it would not.
    #
    # `contents: read` covers `actions/checkout`.
    #
    # `actions/download-artifact` gets nothing and needs nothing: its
    # `github-token` input is documented as "required when downloading
    # artifacts from a different repository or from a different workflow
    # run", and this job is `needs: build` in the same run, so `run-id`
    # keeps its `github.run_id` default and the download goes through the
    # runtime token. The ECS steps are `echo` placeholders today; when they
    # become real `aws ecs update-service` calls they will use the assumed
    # role, which is an AWS permission and not a `GITHUB_TOKEN` scope.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # ── Cosign verification (ZT-3 hard gate) ────────────────────
      # Both verify steps below passed `--certificate-identity-regexp=".*"`
      # until now. That matches every identity, so the gate proved only that
      # the digest carried a signature from somebody holding a GitHub Actions
      # OIDC certificate -- not from this repository, this workflow, or this
      # owner. Anyone who can run a workflow in any public repository could
      # mint a certificate it accepted. Gate 7 in CLAUDE.md says "signing
      # without verification is ceremony"; verification that accepts every
      # signer is the same ceremony one step later.
      #
      # What the certificate actually carries, read out of Fulcio's source
      # rather than recalled: the `Embed` method in
      # pkg/identity/github/principal.go sets `cert.URIs` to the GitHub server
      # URL joined with the `job_workflow_ref` claim. So the SAN for a run of
      # this file is exactly
      #
      #   https://github.com/stefanocalabrese/postern/.github/workflows/deploy.yml@refs/heads/<branch>
      #
      # The pattern is anchored at both ends and its dots are escaped, and
      # neither is decoration. cosign's matcher is a SUBSTRING match:
      # `MatchesSAN` in sigstore-go's pkg/verify/certificate_identity.go calls
      # Go's `regexp.MatchString`, which does not anchor. Without `^` and `$`
      # a padded identity such as
      # `https://evil.example/x?u=https://github.com/...` passes; without the
      # escapes the dots are wildcards and `githubXcom` passes. Both were run
      # against Go's own RE2 before this landed, along with the other-repo,
      # other-workflow, typosquat, tag-ref and pull-ref cases.
      #
      # The ref stays any `refs/heads/` branch rather than the literal
      # `refs/heads/main`, and that is a decision, not an oversight. The
      # deploy job verifies a signature the build job of the SAME dispatch
      # produced, so the signer's ref is always this run's `github.ref`.
      #
      # The reason is not cost, and this comment said it was until
      # 25 September 2026. `environment:` appears exactly once as a job key in
      # this file, on `deploy`, which is `needs: build`. `build` declares
      # none, and `build` is what runs both multi-platform builds, both ECR
      # pushes, both SBOMs, both Trivy scans and both signings. A `deploy` job
      # that cannot start until `build` has succeeded cannot refuse a run any
      # earlier than `build` finishing, so the environment's branch policy and
      # a `main` pinned into this regexp fail at the same boundary, with all
      # of that already paid for.
      #
      # The `production` environment's deployment-branch rule (operator
      # checklist item 4) is still the better control, for its reach and not
      # its timing. It gates the whole `deploy` job, so it stops "Configure
      # AWS credentials", which assumes `AWS_ROLE_ARN` immediately before the
      # first verify step below, and it stops the two ECS steps at the end.
      # This regexp sits inside a step of that job, so by the time it can
      # refuse anything the AWS role is already held.
      #
      # That rule is configured here as of 25 September 2026: one
      # environment, `production`, one `branch_policy` protection rule, one
      # custom branch policy `{name: main, type: branch}` -- type `branch`, so
      # no tag ref satisfies it. `staging` does not exist, and a dispatch
      # naming it auto-creates it with no protection.
      #
      # Whether GitHub enforces that rule on this plan has not been
      # established. The repository is private and the account plan is free,
      # and GitHub's deployments-and-environments reference, fetched
      # 25 September 2026, scopes the feature to "all public repositories"
      # plus private repositories on GitHub Pro or GitHub Team. `main` is not
      # a protected branch here and cannot be: the branch-protection and
      # rulesets REST endpoints both answer 403, "Upgrade to GitHub Pro or
      # make this repository public to enable this feature", which is why the
      # rule is a custom branch policy rather than `protected_branches: true`,
      # a setting that on this repository would match nothing and refuse every
      # deploy including from `main`. The REST write was accepted and reads
      # back, and storage is not enforcement. Settling it would take a
      # dispatch from a side branch, which bills minutes and, if the rule does
      # not hold, performs a real deploy.
      #
      # So this forbids, and is tested to forbid: any other repository,
      # including owner-prefix and repo-suffix typosquats; any other workflow
      # file in this repository, `ci.yml` included; any ref outside
      # `refs/heads/`, which means a dispatch from a tag or a pull-request ref
      # is refused; and any issuer but GitHub's. It does not forbid a build
      # signed from a branch of this repository -- see the environment rule
      # above.
      #
      # `${{ github.ref }}` is deliberately not interpolated into the pattern.
      # Git branch names may contain `$`, backticks, `;`, `&` and quotes, so
      # interpolating one into a `run:` block is the standard Actions
      # script-injection shape. The identity is written out literally and
      # single-quoted, so the shell expands nothing inside it.
      #
      # `--certificate-oidc-issuer` replaces `--certificate-oidc-issuer-regexp`
      # for the same reason the identity gained anchors: the regexp form was
      # also unanchored with unescaped dots, so it accepted
      # `https://token.actions.githubusercontent.com.evil.example`. There is
      # exactly one correct issuer here, and the exact flag is string equality
      # in sigstore-go's `IssuerMatcher`, so it is both stricter and simpler.
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3.9.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify cosign signature — api
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify \
            --certificate-identity-regexp='^https://github\.com/stefanocalabrese/postern/\.github/workflows/deploy\.yml@refs/heads/[A-Za-z0-9._/-]+$' \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --rekor-url=https://rekor.sigstore.dev \
            "${{ env.REGISTRY }}/postern-api@${{ needs.build.outputs.api_digest }}" \
            || (echo "::error::Cosign verification failed for api image — unsigned, tampered, or not signed by this repository's deploy workflow on a branch ref" && exit 1)

      - name: Verify cosign signature — confirm
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify \
            --certificate-identity-regexp='^https://github\.com/stefanocalabrese/postern/\.github/workflows/deploy\.yml@refs/heads/[A-Za-z0-9._/-]+$' \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            --rekor-url=https://rekor.sigstore.dev \
            "${{ env.REGISTRY }}/postern-confirm@${{ needs.build.outputs.confirm_digest }}" \
            || (echo "::error::Cosign verification failed for confirm image — unsigned, tampered, or not signed by this repository's deploy workflow on a branch ref" && exit 1)

      # ── SBOM presence check ─────────────────────────────────────
      - name: Download SBOM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: sboms-${{ github.sha }}

      - name: Verify SBOM presence — api
        run: test -f sbom-api.spdx.json || (echo "::error::SBOM missing for api image" && exit 1)

      - name: Verify SBOM presence — confirm
        run: test -f sbom-confirm.spdx.json || (echo "::error::SBOM missing for confirm image" && exit 1)

      # ── ECS deploy (placeholder — handoff §12.4 leaves this to platform team) ──
      - name: Deploy api to ECS
        run: |
          echo "Deploying ${{ env.REGISTRY }}/postern-api@${{ needs.build.outputs.api_digest }} to ECS"
          # TODO: aws ecs update-service --cluster <cluster> --service postern-api \
          #        --task-definition <td-arn> --force-new-deployment
          # The task definition references the image by digest, not tag.

      - name: Deploy confirm to ECS
        run: |
          echo "Deploying ${{ env.REGISTRY }}/postern-confirm@${{ needs.build.outputs.confirm_digest }} to ECS"
          # TODO: aws ecs update-service --cluster <cluster> --service postern-confirm \
          #        --task-definition <td-arn> --force-new-deployment
