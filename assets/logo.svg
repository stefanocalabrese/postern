<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 128" width="560" height="128" role="img" aria-label="Postern — Zero-Trust MCP Server">
  <defs>
    <linearGradient id="postern-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="postern-grad-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- mark: fortified gate arch -->
  <g transform="translate(16, 20)">
    <!-- outer wall -->
    <rect x="8" y="36" width="72" height="56" rx="4" fill="none" stroke="url(#postern-grad)" stroke-width="5"/>

    <!-- archway (the postern gate opening) -->
    <path d="M24 92 L24 56 Q24 36 44 36 Q64 36 64 56 L64 92" fill="none" stroke="url(#postern-grad)" stroke-width="5"/>

    <!-- keyhole in the gate -->
    <g fill="url(#postern-grad)">
      <circle cx="44" cy="58" r="6"/>
      <path d="M40 62 l-3 18 h14 l-3 -18 z"/>
    </g>

    <!-- decorative battlements -->
    <rect x="12" y="30" width="8" height="8" rx="2" fill="url(#postern-grad)" opacity="0.7"/>
    <rect x="28" y="30" width="8" height="8" rx="2" fill="url(#postern-grad)" opacity="0.7"/>
    <rect x="44" y="30" width="8" height="8" rx="2" fill="url(#postern-grad)" opacity="0.7"/>
    <rect x="60" y="30" width="8" height="8" rx="2" fill="url(#postern-grad)" opacity="0.7"/>

    <!-- dashed security perimeter line -->
    <line x1="4" y1="96" x2="84" y2="96" stroke="url(#postern-grad)" stroke-width="2" stroke-dasharray="3 5" opacity="0.4"/>
  </g>

  <!-- wordmark -->
  <text x="120" y="74" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#postern-grad-h)" letter-spacing="1">POSTERN</text>
  <text x="122" y="100" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#8A8F98" letter-spacing="0.5">Zero-Trust MCP Server for Banking</text>
</svg>
