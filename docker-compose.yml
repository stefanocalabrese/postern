# Local development stack (handoff §8.7): the two service images, a stub of the
# operator's backend, Postgres with the three-role split, and -- since 29
# September 2026 -- a dev-mode Vault that both services sign through. No VPC and
# no real customer; the header said "no Vault" until that date and the `vault`
# and `vault-init` services below are what changed.
#
# `POSTERN_JWKS_URI`/`POSTERN_TOKEN_ISSUER` on `api` point at `confirm`'s
# `/session/jwks.json` and its session issuer since the layer-1 session token.
# What this stack was measured to show on 2 October 2026: the Vault key split
# (api's token signs only `postern-read`, confirm's only `postern-write` and
# `postern-session`), both of confirm's key sets, `api` accepting a session
# token signed by confirm's session key and refusing one from `backend-stub`,
# and one Redis both services write to. It does NOT complete a pairing:
# `/scan` and `/approve` need a banking-app assertion with audience
# `postern-confirm` and an enrolled device, and this stack has neither (the
# stub's `/mint-token` stamps its own `POSTERN_AUDIENCE`, `postern`, and
# `stub/device-keys.json` enrols nobody). Until then
# they pointed at `backend-stub`'s disposable local IdP (`stub/backend.py`'s
# `/.well-known/jwks.json` and `/mint-token` routes), which still exists but
# whose tokens name another issuer and another key, so `api` refuses them.
# They were never left empty, which the plan originally drafted, for two
# Task 13 findings, both against the `services/api/*` code of the day:
#
# 1. `Settings.from_env()` used to read `POSTERN_JWKS_URI`/`POSTERN_TOKEN_ISSUER`
#    via a required `os.environ[...]`, which can only ever produce a `str`
#    (even `""`) or a startup `KeyError` -- never `None`. `services/api/
#    server.py::build_server` branches on `is None` to reach the documented
#    no-auth path, so setting both to `""` (this file's original plan) never
#    reached it: it produced two non-`None` empty strings, which
#    `build_server` tried to build a `JWTVerifier` from. Fixed in
#    `services/api/settings.py`: `from_env()` now normalizes an absent or
#    empty value to `None` for both.
# 2. Even with that fixed, a *genuinely* auth-less stack (both left `""`,
#    reaching `auth=None`) can start and answer `tools/list`, but can never
#    complete a single tool call: every tool's customer resolver is
#    `services/api/server.py::token_customer_resolver` in production, which
#    unconditionally calls `fastmcp.server.dependencies.get_access_token()`
#    -- and that returns `None` on every request when no auth provider is
#    configured at all, so every call fails closed with "request carries no
#    validated access token" (proven manually: see
#    dev-docs/decisions/0004-base-images.md). Proving a real masked `tools/call`
#    response therefore needs genuine, if throwaway, customer JWT auth, not
#    the empty-string shape the plan assumed would still be "no auth".
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postern
      POSTGRES_PASSWORD: postern
      POSTGRES_DB: postern
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postern"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The dev CA and Redis server certificate, generated at `up` time by
  # `dev-redis/gen-certs.sh` and written to named volumes, never to the working
  # tree. A one-shot like `migrate`: `redis` waits for it to exit 0.
  redis-certs:
    # alpine/openssl 3.5.9, pinned by digest: the stack's other images carry no
    # openssl binary (checked: postgres:17-alpine, redis:7-alpine).
    image: alpine/openssl@sha256:59c5cb51e536d40587667229468b007a2a6cae1705397e59e5f7774c08b74029
    entrypoint: ["sh", "/gen-certs.sh"]
    restart: "no"
    volumes:
      - ./dev-redis/gen-certs.sh:/gen-certs.sh:ro
      - redis-tls:/redis-tls
      - redis-ca:/redis-ca

  # The shared state both services need: the ZT-7 list, device codes, refresh
  # families and the risk session store. `services/confirm` refuses to start
  # without POSTERN_REDIS_URL unless POSTERN_ALLOW_PROCESS_LOCAL_SESSIONS is
  # set, and this stack does not set it, so a recall at `/scan` reaches `api`.
  # OPERATOR CHECKLIST ITEM 6, applied here rather than described. Until 3
  # October 2026 this was `redis:7-alpine` with no password, no TLS and a
  # default user open to the whole network; it now does what item 6 asks:
  #
  #   TLS ONLY     `--port 0` closes the plaintext listener, `--tls-port 6379`
  #                opens the TLS one. A plain-TCP client gets a
  #                connection reset (measured from the api container).
  #   AUTH + ACL   `dev-redis/users.acl`: the `default` user is OFF, `api` and
  #                `confirm` each hold their own user, limited to the key
  #                prefixes and commands their code issues (the derivation
  #                is the table in
  #                docs/user-guide/components/session-store.md), and
  #                tests/test_redis_acl_users.py drives the real stores
  #                through it. An ACL file takes no comments, which is why
  #                the explanation is here and not there.
  #   NO PORTS     no `ports:` mapping. The host cannot reach this Redis; only
  #                containers on the compose network can, by the name `redis`.
  #                Reach it from the host with
  #                `docker compose exec redis redis-cli --tls --cacert /tls/ca.crt ...`.
  #
  # WHAT THIS STILL IS NOT. The certificates are throwaway dev certificates
  # from `redis-certs` above, not an operator's PKI. `--tls-auth-clients no`
  # means Redis does not ask a client for a certificate: the credential is the
  # ACL user's password, and mutual TLS is not exercised here. The passwords
  # sit in plaintext in `dev-redis/users.acl` and this file. The JWKS fetch between
  # the services is still plain HTTP (see `api` below). Persistence stays off
  # (`--save ""`, no AOF) so live device codes and refresh families are never
  # snapshotted to disk.
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --aclfile
      - /etc/redis/users.acl
      - --port
      - "0"
      - --tls-port
      - "6379"
      - --tls-cert-file
      - /tls/server.crt
      - --tls-key-file
      - /tls/server.key
      - --tls-ca-cert-file
      - /tls/ca.crt
      - --tls-auth-clients
      - "no"
    volumes:
      - ./dev-redis/users.acl:/etc/redis/users.acl:ro
      - redis-tls:/tls:ro
    healthcheck:
      test:
        - CMD
        - redis-cli
        - --tls
        - --cacert
        - /tls/ca.crt
        - --user
        - postern_health
        - --pass
        - postern-health-dev
        - --no-auth-warning
        - ping
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      redis-certs:
        condition: service_completed_successfully

  # OPERATOR CHECKLIST ITEM 11, applied here rather than described. Until
  # 29 September 2026 every container in this file connected as `postern`, the
  # bootstrap SUPERUSER, which is also the owner of every table `migrate`
  # creates. Against that role `audit_log`'s append-only triggers are two
  # statements from being off -- measured, not argued, in
  # `tests/test_audit_append_only.py`, which performs both bypasses.
  #
  # There are now three roles in this stack and the services hold the weakest:
  #
  #   postern         superuser. Creates the other two and nothing else.
  #   postern_owner   owns every table, runs `alembic upgrade head`. No service.
  #   postern_app     owns nothing, not a superuser, holds exactly
  #                   `sql/02-grants.sql`. `api` and `confirm` connect as this.
  #
  # THREE ONE-SHOT SERVICES BECAUSE THERE ARE THREE PRIVILEGE LEVELS, and the
  # order between them is not cosmetic: a role must exist before it can own a
  # table, a table must exist before anything can be granted on it. `depends_on`
  # with `service_completed_successfully` is what serialises them, the same
  # shape `migrate` already used.
  #
  # `postgres:17-alpine` rather than the repo's own images because `psql` is
  # what runs a `.sql` file, and neither serving image carries it. That is a
  # feature: the two scripts are SQL an operator runs with the client they
  # already have, not Python this repository has to ship.
  db-roles:
    image: postgres:17-alpine
    restart: "no"
    volumes:
      - ./sql:/sql:ro
    environment:
      PGPASSWORD: postern
    # The passwords are set HERE and not in `sql/01-roles.sql`, which creates
    # both roles able to log in and unable to authenticate. A credential in a
    # repository is a credential in every clone of it; these two are throwaway
    # local-development values sitting beside the throwaway superuser password
    # three lines up in this same file, and a deployment sets its own from a
    # secrets manager instead.
    command: >
      sh -ec '
      psql -v ON_ERROR_STOP=1 -h db -U postern -d postern -f /sql/01-roles.sql;
      psql -v ON_ERROR_STOP=1 -h db -U postern -d postern
      -c "ALTER ROLE postern_owner PASSWORD '"'"'postern_owner'"'"'"
      -c "ALTER ROLE postern_app PASSWORD '"'"'postern_app'"'"'";
      '
    depends_on:
      db:
        condition: service_healthy

  # OPERATOR CHECKLIST ITEM 6, applied here rather than described. Until 29
  # September 2026 this stack had no Vault at all and both services generated a
  # 2048-bit RSA key in process, which is the branch `KeySource` still keeps for
  # exactly this kind of local development. What it could not show is the thing
  # item 6 is actually about: under transit the private key is generated inside
  # Vault, is never handed to any process, and cannot be handed to one --
  # measured, `GET /v1/transit/export/signing-key/postern-read` answers 400
  # "private key material is not exportable" to the ROOT token, not 403 from a
  # policy somebody could widen.
  #
  # DEV MODE, and that is not a shortcut around the property this demonstrates.
  # Dev mode means in-memory storage, auto-unseal and a known root token -- it
  # changes where Vault keeps its own data and who can administer it, and
  # changes nothing about transit: the key is still generated inside Vault,
  # still not exportable, and the two ACL policies below are the same documents
  # a production deployment applies. What dev mode costs is durability (the keys
  # are gone when this container stops, so every `docker compose up` publishes a
  # new JWKS) and the root token, which is on the next line in plaintext.
  #
  # A DEPLOYMENT OWES: a real Vault with real storage, an auth method instead of
  # the root token (Kubernetes, AWS IAM or AppRole), a Vault Agent rendering the
  # token to the sink `POSTERN_VAULT_TOKEN_PATH` names, and the two policies
  # below attached to two roles. Item 6 in CLAUDE.md is where that list belongs.
  vault:
    image: hashicorp/vault:1.20
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: postern-dev-root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]
    # The audit device's log file (enabled by `vault-init`). /vault/logs is the
    # directory the image's entrypoint chowns to the `vault` user.
    volumes:
      - vault-audit:/vault/logs
    # IPC_LOCK is how Vault keeps its memory out of swap. Dev mode does not need
    # it and warns without it; granting it here keeps the warning out of the log
    # an operator reads while bringing this stack up for the first time.
    cap_add: ["IPC_LOCK"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The objects an operator creates (transit, a file audit device, three keys,
  # two policies, two tokens), executed.
  #
  # THE AUDIT DEVICE IS DEV-GRADE. `file` writes one JSON line per request and
  # response to `/vault/logs/audit.log` on the `vault-audit` volume, with
  # secrets HMAC-salted by Vault, so a sign call leaves a record here that the
  # signing process cannot edit. It is not a production control: the log sits
  # on the same Docker host as the Vault it audits, it has no rotation, no
  # shipping and no retention, and dev mode's root token can disable it.
  # Read it with `docker compose exec vault cat /vault/logs/audit.log`. A
  # deployment owes its own device (a socket or syslog sink off the host) and
  # its own retention. It is enabled first, ahead of the keys, so the key
  # creation below is recorded as well. Only "already enabled" is
  # tolerated: any other failure of `vault audit enable` fails this service, and
  # so the stack, and the last check before the closing echo fails it if the
  # device is not listed.
  #
  # IT IS SAFE TO RUN AGAIN against a Vault that already has these objects
  # (`docker compose run --rm vault-init`). Each enable and each key is guarded
  # by looking first, so only the already-exists case is skipped and any other
  # error fails the service; policies are upserts. EVERY KEY IS THEN READ BACK,
  # created now or earlier: one that is exportable, or not rsa-2048, fails the
  # service with a non-zero exit, because an existing exportable key would
  # otherwise pass and switch off the control this stack demonstrates. A token
  # already on the volume is kept only when its policy list is exactly
  # `[default postern-<role>]`, and is renewed (its period reset) so a re-run
  # near the end of the 24h period does not keep one about to lapse; a token
  # that fails either test, or no longer looks up (a Vault that was reset), is
  # replaced by a fresh one.
  #
  # The rest of this is `tests/test_vault_live.py`'s `vault` fixture as a shell
  # script, and those two must stay in step, with one deliberate difference:
  # that fixture enables NO audit device, because the test asserts on signing
  # behaviour and a file device on a throwaway container would only add a
  # path to clean up. This service enables one because the stack is what an
  # operator reads. If they disagree about keys, policies or tokens, one of
  # them is wrong about what a deployment needs.
  #
  # THE TWO POLICIES ARE THE READ/WRITE SPLIT. `postern-read` grants `update` on
  # ONE sign path and `read` on ONE key path. It grants nothing on the write
  # key, so the `api` container below cannot obtain a payment-token signature
  # even though it knows the key's name, the mount and the address -- measured
  # in `tests/test_vault_live.py::TestTheReadServiceCannotSignWithTheWriteKey`
  # and demonstrable against this stack with one curl. `postern-write` carries
  # the write key and the SESSION key, which signs the layer-1 access tokens
  # `confirm` issues at `POST /token`, and nothing on the read key: no process
  # holds READ and WRITE together since the layer-1 session token.
  #
  # THE TOKENS GO TO A FILE ON A SHARED VOLUME, not into an environment
  # variable, and that is the whole reason this service exists rather than two
  # hardcoded values in this file. A file is the Vault Agent sink shape:
  # `postern_core.auth.vault`'s `_token_from` re-reads it on every call, so an
  # agent renewing the token is picked up without a restart. Compose cannot put
  # a value computed at up-time into another service's `environment:` anyway.
  vault-init:
    image: hashicorp/vault:1.20
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: postern-dev-root
    volumes:
      - vault-tokens:/vault-tokens
    command: >
      sh -ec '
      vault secrets list | grep -q "^transit/" || vault secrets enable transit;
      vault audit list | grep -q "^file/" || vault audit enable file file_path=/vault/logs/audit.log;
      for key in postern-read postern-write postern-session; do
      vault read transit/keys/$$key > /dev/null 2>&1 || vault write -f transit/keys/$$key type=rsa-2048;
      if [ "$$(vault read -field=exportable transit/keys/$$key)" != "false" ] || [ "$$(vault read -field=type transit/keys/$$key)" != "rsa-2048" ]; then echo "vault-init: key $$key is exportable or not rsa-2048, refusing to continue" >&2; exit 1; fi;
      done;
      echo "path \"transit/sign/postern-read\" { capabilities = [\"update\"] }
      path \"transit/keys/postern-read\" { capabilities = [\"read\"] }" | vault policy write postern-read -;
      echo "path \"transit/sign/postern-write\" { capabilities = [\"update\"] }
      path \"transit/keys/postern-write\" { capabilities = [\"read\"] }
      path \"transit/sign/postern-session\" { capabilities = [\"update\"] }
      path \"transit/keys/postern-session\" { capabilities = [\"read\"] }" | vault policy write postern-write -;
      live() { [ -s /vault-tokens/$$1.token ] || return 1; t="$$(cat /vault-tokens/$$1.token)"; [ "$$(VAULT_TOKEN=$$t vault token lookup | grep -E "^policies " | tr -s " " | cut -d" " -f2-)" = "[default postern-$$1]" ] && VAULT_TOKEN=$$t vault token renew > /dev/null; };
      for role in read write; do
      if live $$role;
      then echo "vault-init: reusing and renewing the $$role token";
      else vault token create -policy=postern-$$role -period=24h -field=token > /vault-tokens/$$role.token;
      fi;
      done;
      chmod 0444 /vault-tokens/read.token /vault-tokens/write.token;
      vault audit list | grep -q "^file/";
      echo "vault-init: transit enabled, file audit device, three keys, two policies, two tokens";
      '
    depends_on:
      vault:
        condition: service_healthy

  backend-stub:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
    working_dir: /app
    volumes:
      - ./:/app
      # Anonymous volume over `.venv`: without it, a `.venv` created on the
      # host (a different OS/ABI than this Linux container) would be bind-
      # mounted straight over the container's own, and `uv run` would try to
      # execute host-built binary extensions (pydantic-core, uvloop, ...)
      # under the wrong platform.
      - /app/.venv
    environment:
      POSTERN_TOKEN_ISSUER: "https://postern-local-dev.invalid"
      POSTERN_AUDIENCE: "postern"
    command: uv run uvicorn stub.backend:app --host 0.0.0.0 --port 8081
    ports: ["8081:8081"]

  # The migration runner, and the reason it is a service here rather than a
  # step in the images: since the serving images stopped carrying `alembic`
  # and the revision scripts, nothing in this stack applied the schema.
  # `docker compose up` left an empty database and every tool call 500ed on
  # the consent lookup -- measured on 28 September 2026, before this existed.
  #
  # `restart: "no"` and `service_completed_successfully` below are what make
  # it a task rather than a daemon: it runs `alembic upgrade head`, exits 0,
  # and the two services start behind it. A non-zero exit stops the stack,
  # which is the same direction the deploy workflow takes.
  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      # THE OWNER, and this is the line that makes the split real. The tables
      # `alembic upgrade head` creates are owned by whoever runs it, so this
      # value decides which role can reach `audit_log`'s triggers. It is the
      # only container in this file that holds it.
      POSTERN_DATABASE_URL: postgresql+asyncpg://postern_owner:postern_owner@db:5432/postern
    depends_on:
      db:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully

  # The grants, as `postern_owner`, after the migrations. Re-run on every
  # `docker compose up` because that is what a deployment does after every
  # release: a migration that adds a table leaves it reachable by nobody until
  # this runs again, and the REVOKE pair at the top of the file makes re-running
  # restore the intended set rather than merely add to it.
  db-grants:
    image: postgres:17-alpine
    restart: "no"
    volumes:
      - ./sql:/sql:ro
    environment:
      PGPASSWORD: postern_owner
    command: >
      psql -v ON_ERROR_STOP=1 -h db -U postern_owner -d postern -f /sql/02-grants.sql
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      target: api
    environment:
      POSTERN_BACKEND_BASE_URL: http://backend-stub:8081
      # The application role: owns nothing, is not a superuser, and cannot
      # UPDATE, DELETE or TRUNCATE `audit_log` -- refused at the ACL check,
      # before the trigger is consulted. An RCE in this container inherits
      # exactly this.
      POSTERN_DATABASE_URL: postgresql+asyncpg://postern_app:postern_app@db:5432/postern
      # THE SESSION TOKENS `confirm` ISSUES, verified against its
      # `/session/jwks.json`. The issuer is confirm's default
      # POSTERN_SESSION_TOKEN_ISSUER and the audience is the same resource URI
      # confirm stamps as `aud`, so neither container needs
      # POSTERN_ALLOW_NON_URI_AUDIENCE. The fetch is lazy, at the first token.
      # Plain HTTP is dev-only: a deployment fetches this over TLS, because a
      # MITM on this fetch can plant a key and forge any customer's token.
      POSTERN_JWKS_URI: http://confirm:8080/session/jwks.json
      POSTERN_TOKEN_ISSUER: "https://auth.postern.internal"
      POSTERN_AUDIENCE: "https://mcp.postern.internal/mcp"
      #
      # TLS AND A PER-SERVICE ACL USER. `rediss://` with the dev CA from the
      # `redis-ca` volume (`ssl_ca_certs`) and certificate hostname checking
      # on (`ssl_check_hostname=true`; the server certificate's SAN is
      # `redis`). Every Redis client in the code is built by `redis.from_url`
      # or `redis.Redis.from_url`, so these query parameters apply to all of
      # them, the startup preflight included. This user is the one named
      # `postern_api` in `dev-redis/users.acl`.
      POSTERN_REDIS_URL: "rediss://postern_api:postern-api-dev@redis:6379/0?ssl_ca_certs=/redis-ca/ca.crt&ssl_check_hostname=true"
      POSTERN_STRICT_HEADERS: "0"
      # THE SIGNING KEY IS NOT IN THIS CONTAINER. With these three set,
      # `postern_core.auth.keys.choose_key_source` builds a
      # `VaultTransitKeySource` and every internal token is signed by Vault.
      # POSTERN_READ_KEY_PEM_PATH is deliberately absent: setting both is
      # REFUSED at startup, because a PEM still on disk is still the thing an
      # RCE finds.
      #
      # THE KEY NAME IS THE READ KEY AND THIS CONTAINER'S TOKEN CANNOT SIGN
      # WITH ANY OTHER. Changing this line to `postern-write` does not widen
      # anything: the token at the path below carries the `postern-read`
      # policy, so the sign call answers 403 and this container crash-loops at
      # startup. That is the demonstration worth running once.
      POSTERN_VAULT_ADDR: http://vault:8200
      POSTERN_VAULT_TOKEN_PATH: /vault-tokens/read.token
      POSTERN_VAULT_READ_KEY_NAME: postern-read
    volumes:
      - vault-tokens:/vault-tokens:ro
      - redis-ca:/redis-ca:ro
    ports: ["8080:8080"]
    depends_on:
      backend-stub:
        condition: service_started
      db:
        condition: service_healthy
      db-grants:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

  # THE OPERATOR'S REVOCATION CLI, as a one-shot that is never started by
  # `docker compose up` (the profile keeps it out). Redis is not published, so
  # the supported way to run `postern_core.auth.revoke_cli` against this stack
  # is a container on the compose network that mounts the CA read-only:
  #
  #   docker compose run --rm revoke session <jti>
  #   docker compose run --rm revoke prune-sessions
  #   docker compose run --rm revoke list
  #
  # It signs in as `postern_operator` from `dev-redis/users.acl`, which holds
  # what the CLI issues on `postern:revoked:*` and nothing else; neither
  # `api` nor `confirm` holds that user. It builds the `api` target only because
  # that target already carries `postern_core`; it is the same layers under its
  # own image tag, not the api image. No service reads this URL.
  revoke:
    profiles: ["operator"]
    build:
      context: .
      target: api
    entrypoint:
      - python
      - -c
      - import sys; from postern_core.auth.revoke_cli import main; sys.exit(main(sys.argv[1:]))
    environment:
      POSTERN_REDIS_URL: "rediss://postern_operator:postern-operator-dev@redis:6379/0?ssl_ca_certs=/redis-ca/ca.crt&ssl_check_hostname=true"
    volumes:
      - redis-ca:/redis-ca:ro
    depends_on:
      redis:
        condition: service_healthy

  # Plan 3 Task 6: the write path, brought up alongside `api` to verify the
  # read/write key split against a running stack rather than only in-process.
  # `POSTERN_WRITE_KEY_PEM_PATH` is still unset, the same way `api` above sets
  # no read PEM path -- but since 29 September 2026 that no longer means an
  # ephemeral in-process key in this stack: both containers set
  # `POSTERN_VAULT_ADDR` and sign through Vault, and neither holds a private
  # key at all. docs/verification/2026-09-18-key-split.md measured the old
  # arrangement and its "both generated their own" caveat no longer applies
  # here.
  confirm:
    build:
      context: .
      target: confirm
    ports: ["8082:8080"]
    # Required since the confirm service gained inbound authentication (audit
    # findings C-01, C-02): `create_confirm_app` REFUSES to start without all
    # three, because there is no unauthenticated mode on the write path.
    # Without these three lines this container crash-loops, which is the
    # intended behaviour of that guard and the reason they are here.
    #
    # The app-assertion audience is `postern-confirm`: a different issuer, key
    # and audience from the session token `api` verifies (issuer
    # `https://auth.postern.internal`, audience
    # `https://mcp.postern.internal/mcp`, key `postern-session`). That is the
    # one value worth getting right: if both services took the same audience
    # from the same issuer, a customer
    # token good enough to list a balance would also be good enough to approve
    # a payment, and the read/write split would hold at the signing layer
    # while being void at the identity layer. Nothing in either process can
    # detect that -- they are separate deployments with separate environments
    # -- so the split lives here and in the operator's Terraform.
    #
    # The JWKS points at `backend-stub` because the stub stands in for the
    # banking app's assertion issuer. There is still no `depends_on`: the
    # fetch is lazy, inside `load_access_token`, so a `confirm` that starts
    # before the stub is up simply refuses tokens until it is.
    #
    # `POSTERN_DEVICE_KEYS_PATH` is required for the same reason and by the
    # same kind of guard (`services/confirm/main.py`'s `_device_key_store`):
    # since 2026-09-24 an approval must carry an Ed25519 signature from a
    # device the operator enrolled for that customer, and a service with no
    # way to check one is the finding, not a convenience. Without this line
    # the container crash-loops.
    #
    # The file it points at enrols NOBODY, so this stack starts, warns loudly,
    # and refuses every approval with `device_not_enrolled`. That is the whole
    # local-development path: explicit, greppable, and not a mode that
    # verifies less. The database is wired (POSTERN_DATABASE_URL below), but
    # with nobody enrolled no approval can pass the signature check.
    #
    # BIND-MOUNTED RATHER THAN BAKED IN, and that is not a preference:
    # `.dockerignore` excludes `stub/` from the build context of both images,
    # so a path inside the image would not exist and this container would
    # crash-loop on a missing file instead of on a missing variable. Mounting
    # it read-only also matches what a deployment does -- an enrolment export
    # arrives as a mounted secret, not as a layer.
    volumes:
      - ./stub/device-keys.json:/etc/postern/device-keys.json:ro
      - vault-tokens:/vault-tokens:ro
      - redis-ca:/redis-ca:ro
    environment:
      # THE WRITE KEY AND THE SESSION KEY THROUGH ONE VAULT TOKEN, and no
      # read key: `POST /token` issues a layer-1 session signed by
      # `postern-session`, which `api` verifies at `/session/jwks.json`. What
      # no policy anywhere grants is the reverse -- `api`'s token has nothing
      # on `transit/sign/postern-write` or `transit/sign/postern-session`.
      POSTERN_VAULT_ADDR: http://vault:8200
      POSTERN_VAULT_TOKEN_PATH: /vault-tokens/write.token
      POSTERN_VAULT_WRITE_KEY_NAME: postern-write
      POSTERN_VAULT_SESSION_KEY_NAME: postern-session
      # The MCP server's resource URI, stamped as `aud` on every access token
      # and equal to `api`'s POSTERN_AUDIENCE above.
      POSTERN_SESSION_TOKEN_AUDIENCE: "https://mcp.postern.internal/mcp"
      # Refresh families and recalls must reach `api`: the same Redis.
      #
      # `rediss://` and `confirm`'s own ACL user, `postern_confirm`; see the
      # note on `api`'s URL and `dev-redis/users.acl`. Same Redis as `api`, a
      # different user and different keys.
      POSTERN_REDIS_URL: "rediss://postern_confirm:postern-confirm-dev@redis:6379/0?ssl_ca_certs=/redis-ca/ca.crt&ssl_check_hostname=true"
      POSTERN_APP_ASSERTION_JWKS_URI: http://backend-stub:8081/.well-known/jwks.json
      POSTERN_APP_ASSERTION_ISSUER: "https://postern-local-dev.invalid"
      POSTERN_APP_ASSERTION_AUDIENCE: "postern-confirm"
      POSTERN_DEVICE_KEYS_PATH: /etc/postern/device-keys.json
      # UNSET UNTIL 29 SEPTEMBER 2026, which meant this service resolved
      # `Database`'s own default, `localhost:5432`, inside its own container.
      # The engine is lazy so it started fine and failed on first use: every
      # approval, every `audit_log` row, every challenge lookup. The comment
      # above this block still said "no database" from when that was true.
      #
      # The application role, for the same reason `api` above holds it. This
      # service is the one that writes the approval rows, so it is the one
      # whose compromise the split is actually bought against.
      POSTERN_DATABASE_URL: postgresql+asyncpg://postern_app:postern_app@db:5432/postern
    depends_on:
      db:
        condition: service_healthy
      db-grants:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

# The one shared volume in this stack, and it carries two credentials rather
# than any data. Named rather than a bind mount so nothing lands in the working
# tree: a Vault token in a repository is a Vault token in every clone of it, the
# same argument `db-roles` above makes for the two database passwords.
#
# Four more since 3 October 2026: `redis-tls` (the server's certificate and
# private key, mounted by `redis` only), `redis-ca` (the CA certificate, which
# `api` and `confirm` mount read-only and which holds no secret) and
# `vault-audit` (the audit log). Named for the same reason: no key material or
# log lands in the working tree.
volumes:
  vault-tokens:
  redis-tls:
  redis-ca:
  vault-audit:
