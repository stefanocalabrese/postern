[project]
name = "postern-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "joserfc>=1.7.5,<2",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "asyncpg>=0.31,<1",
    "httpx2>=2.12.0,<3",
]

[project.optional-dependencies]
redis = [
    "redis[hiredis]>=5.2,<6",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"
