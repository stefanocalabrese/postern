[project]
name = "postern"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "postern-core[redis]",
    "postern-cards",
    "postern-cards-write",
    "fastmcp>=4.0.3,<5",
    "uvicorn[standard]>=0.34",
    "structlog>=25.1",
    "sqlalchemy[asyncio]>=2.0.52,<3",
    "asyncpg>=0.31",
    "alembic>=1.20,<2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
postern-core = { workspace = true }
postern-cards = { workspace = true }
postern-cards-write = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=1.14",
    "import-linter>=2.15",
    "testcontainers[postgres]>=4.15",
    "types-docker>=7.2.0.20260827",
    "fakeredis>=2.20",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
